set -sg escape-time 10
set -g allow-passthrough on
setw -g mode-keys vi
set -g history-limit 30000
set -g mouse on
set -g base-index 1

bind-key t new-window
bind-key Enter split-window -h \; select-layout even-horizontal
set-hook -g pane-exited 'select-layout even-horizontal'
set-hook -g after-kill-pane 'select-layout even-horizontal'

# --- 临时 start
set -g pane-border-lines double
set-window-option -g pane-border-lines double
set-window-option -g pane-border-style "fg=colour240"
set-window-option -g pane-active-border-style "fg=green"
set-window-option -g pane-border-status top
set-window-option -g pane-border-format " #P: #{pane_current_command} "
# --- 临时 end

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi H send-keys -X start-of-line
bind-key -T copy-mode-vi L send-keys -X end-of-line
bind-key -T copy-mode-vi J send-keys -X -N 5 cursor-down
bind-key -T copy-mode-vi K send-keys -X -N 5 cursor-up
bind-key -T copy-mode-vi C-e send-keys -X -N 3 scroll-down
bind-key -T copy-mode-vi C-y send-keys -X -N 3 scroll-up

